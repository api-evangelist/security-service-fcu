name: Security Service Federal Credit Union
kind: company
description: >-
  Security Service Federal Credit Union (SSFCU), headquartered in San Antonio,
  Texas, is a member-owned, not-for-profit financial cooperative federally
  chartered and insured by the National Credit Union Administration (NCUA). It
  is one of the largest credit unions in the United States, serving members
  across Texas, Colorado, and Utah with consumer and business banking, deposit
  accounts, credit cards, auto and mortgage lending, and investment services
  through branches, online banking, and mobile apps. Its open-finance posture is
  the norm for a US credit union: there is no first-party public developer
  portal or downloadable API specification, and no public FDX or CFPB Section
  1033 data-access API is documented. Consumer-permissioned account data is
  reachable only indirectly through third-party aggregators, and any API
  capability is delivered through its core banking provider rather than a
  self-serve developer program.
